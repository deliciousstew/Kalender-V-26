name: Kalender aktualisieren

on:
  schedule:
    - cron: "0 5 * * *"   # täglich ca. 6-7 Uhr deutscher Zeit
  workflow_dispatch:       # manuell startbar im Tab "Actions"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhängigkeiten installieren
        run: pip install requests beautifulsoup4

      - name: ICS-Dateien erzeugen
        run: python update_calendar.py

      - name: Statusdatei schreiben
        run: |
          date -u +"Letzter Lauf: %Y-%m-%d %H:%M UTC" > docs/status.txt

      - name: Änderungen speichern
        run: |
          git config user.name "kalender-bot"
          git config user.email "kalender-bot@users.noreply.github.com"
          git add docs
          git diff --cached --quiet || (git commit -m "Kalender aktualisiert" && git push)
